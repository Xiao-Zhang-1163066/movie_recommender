name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.js
      - app.js
      - routes/**
      - controller/**
      # Added late: services/ arrived in Sprint 1 and was missing here, so a
      # change confined to conversationService, agentTools or embeddingService
      # built and tested green and then never shipped. Any new top-level source
      # directory has to be added to this list or it is silently undeployable.
      - services/**
      - middleware/**
      - validators/**
      - utils/**
      - config/**
      - prisma/**
      - test/**
      - vitest.config.js
      - Dockerfile
      - package*.json
      # The workflow's own definition. Omitting it meant a commit that changed
      # only this file could not deploy itself — proven the hard way on
      # 2026-09-21: the fix that added --revision-suffix was pushed, triggered
      # nothing, and had to be applied by hand with `az containerapp update`.
      #
      # Adding it has no chicken-and-egg problem, contrary to what this comment
      # first claimed: a push event is filtered using the workflow definition
      # *from the pushed commit*, so the commit that adds this line is matched
      # by it. Measured rather than reasoned about — c611a2f changed only this
      # file and did trigger a run.
      - .github/workflows/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tests gate the deploy: they run before the image is built, so a failure
      # stops the release rather than shipping and rolling back. No secrets are
      # needed — test/setup.js clears the database and Redis URLs, and the suite
      # mocks both clients.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # generated/prisma is gitignored, so the client has to be built from the
      # schema before anything can import config/db.js.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: moviemate.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: moviemate.azurecr.io/movie-mate-api:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --revision-suffix is what actually ships the new code, and it is not
      # cosmetic. The image tag is always ":latest", so without it this command
      # submits a template identical to the running one, Container Apps sees no
      # change, no revision is created, and the old image keeps serving — while
      # the workflow still reports success because `az` itself succeeded.
      #
      # Observed on 2026-09-21: run for bb71b17 went green at 03:02:38Z, the
      # image reached ACR at 03:04:01Z, and the serving revision was still the
      # one created at 03:00:32Z. A green deploy that shipped nothing.
      #
      # github.run_number is monotonic, so each run gets a unique suffix; a
      # repeated suffix is rejected outright.
      - name: Update Container App
        run: |
          az containerapp update \
            --name movie-mate-api \
            --resource-group ai-movie-mate-rg \
            --image moviemate.azurecr.io/movie-mate-api:latest \
            --revision-suffix r${{ github.run_number }}
