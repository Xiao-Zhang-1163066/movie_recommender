name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.js
      - app.js
      - routes/**
      - controller/**
      - middleware/**
      - validators/**
      - utils/**
      - config/**
      - prisma/**
      - test/**
      - vitest.config.js
      - Dockerfile
      - package*.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tests gate the deploy: they run before the image is built, so a failure
      # stops the release rather than shipping and rolling back. No secrets are
      # needed — test/setup.js clears the database and Redis URLs, and the suite
      # mocks both clients.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # generated/prisma is gitignored, so the client has to be built from the
      # schema before anything can import config/db.js.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: moviemate.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: moviemate.azurecr.io/movie-mate-api:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name movie-mate-api \
            --resource-group ai-movie-mate-rg \
            --image moviemate.azurecr.io/movie-mate-api:latest
