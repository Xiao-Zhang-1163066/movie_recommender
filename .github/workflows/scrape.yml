name: Scrape Cinema Sessions

on:
  schedule:
    - cron: 0 18 * * * # daily at 6am NZ time (UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
        run: python run.py

      # The scraper inserts films but cannot embed them: the embedding text is
      # defined once, in services/embeddingService.js, and duplicating it in
      # Python would be a second definition free to drift from the first.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci

      # generated/prisma is gitignored, so it does not exist after a fresh
      # checkout and nothing can import config/db.js without it.
      # deploy-backend.yml has always had this step; omitting it here is exactly
      # why the first scheduled run of the embed step died with
      # ERR_MODULE_NOT_FOUND on generated/prisma/index.js. The scrape step above
      # is Python and never needed it, which is what made the gap easy to miss.
      - name: Generate Prisma client
        run: npx prisma generate

      # Unchanged films cost nothing here — embeddingHash means only what the
      # scraper just inserted or changed is sent to Gemini.
      - name: Embed new movies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run embed:backfill
